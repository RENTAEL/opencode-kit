# Optional CI: lints Markdown on every push/PR so docs stay clean.
# Safe & permissive (line-length and inline-HTML rules disabled).
# Delete this file if you don't want CI.
name: Lint Markdown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
