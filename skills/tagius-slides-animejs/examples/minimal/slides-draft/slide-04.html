<!-- Slide 4 — Step protocol: PowerPoint-style click-advance with per-step idle.
     window.__slideSteps = K and window.__slideStep(n, dir) drive in-slide reveals.
     The parent calls __slideStep(0,1) on enter, then 1..K on ArrowRight. -->
<style>
  :root {
    --bg: #0b0c1a; --surface: #181a2d; --fg: #f5f5f7; --muted: #a8acb8;
    --accent: #7c5cff; --accent-2: #ffd166;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 720px; height: 405px; overflow: hidden;
    background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  .slide { width: 720px; height: 405px; padding: 36px 56px 44px;
    display: flex; flex-direction: column; gap: 14px; position: relative; }
  .eyebrow { color: var(--accent); font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; font-weight: 700; }
  h1 { font-size: 32px; font-weight: 800; }
  .cards { display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center; }
  .card { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 12px;
    background: var(--surface); border: 1.5px solid rgba(255,255,255,0.06);
    opacity: 0.35; transition: opacity .3s ease, border-color .3s ease, box-shadow .3s ease; }
  .card.is-done { opacity: 0.6; }
  .card.is-active { opacity: 1; border-color: var(--accent); box-shadow: 0 6px 22px rgba(124,92,255,0.25); }
  .badge { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
    transform-origin: center; }
  .card .label { font-size: 18px; font-weight: 500; }
  .slide-footer { position: absolute; bottom: 0; left: 0; right: 0; height: 26px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    z-index: 100; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(11,12,26,0.7); }
  .brand, .slide-num { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
  .hint { font-size: 11px; color: var(--muted); }
</style>
<div class="slide">
  <div class="eyebrow" data-anim data-anim-from="down">reveal one at a time</div>
  <h1 data-anim data-anim-from="up">Click-advance steps</h1>
  <div class="cards">
    <div class="card" id="c1" data-anim data-anim-from="right"><div class="badge">1</div><div class="label">Press → and the first card lights up.</div></div>
    <div class="card" id="c2" data-anim data-anim-from="right"><div class="badge">2</div><div class="label">Each reveal gets its own micro-animation.</div></div>
    <div class="card" id="c3" data-anim data-anim-from="right"><div class="badge">3</div><div class="label">After the last step, → moves to the next slide.</div></div>
  </div>
  <div class="hint" data-anim data-anim-from="fade">3 in-slide steps · ArrowLeft reverses</div>
</div>
<div class="slide-footer">
  <span class="brand">slides-animejs</span>
  <span class="slide-num">4 / 5</span>
</div>
<script type="module">
  import { animate } from "/assets/anime.esm.min.js";

  window.__slideSteps = 3;                 // parent advances 0..3 before leaving the slide
  const cards = ['c1', 'c2', 'c3'].map(id => document.getElementById(id));
  let idle = null;

  function clearIdle() { try { idle?.cancel?.(); } catch (e) {} idle = null; }

  function startIdle(step) {
    clearIdle();
    if (step < 1) return;
    const badge = cards[step - 1]?.querySelector('.badge');
    if (!badge) return;
    // Per-step idle: only the active card's badge pulses.
    idle = animate(badge, {
      scale: [{ to: 1.15 }, { to: 1 }],
      duration: 1100, loop: true, alternate: true, ease: 'inOutSine',
    });
  }

  // n = 0 base state (nothing active); n = 1..3 reveals card n, earlier cards "done".
  window.__slideStep = (n, dir) => {
    cards.forEach((c, i) => {
      c.classList.remove('is-active', 'is-done');
      if (n > 0) {
        if (i === n - 1) c.classList.add('is-active');
        else if (i < n - 1) c.classList.add('is-done');
      }
    });
    startIdle(n);
  };

  // Register cleanup under this slide's 0-based index (slide 4 → index 3).
  window.__slideTL = window.__slideTL || {};
  window.__slideTL[3] = (root) => ({
    cancel: () => { clearIdle(); cards.forEach(c => c.classList.remove('is-active', 'is-done')); },
  });
</script>
