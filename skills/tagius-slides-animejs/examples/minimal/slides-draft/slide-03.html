<!-- Slide 3 — Two-column content: staggered entrance, baseline idle, footer safe-zone.
     Content clears the 26px footer band via padding-bottom: 44px. -->
<style>
  :root {
    --bg: #0b0c1a; --surface: #181a2d; --fg: #f5f5f7; --muted: #a8acb8;
    --accent: #7c5cff; --accent-2: #ffd166;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 720px; height: 405px; overflow: hidden;
    background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  .slide { width: 720px; height: 405px; padding: 36px 56px 44px;
    display: flex; flex-direction: column; gap: 16px; position: relative; }
  .eyebrow { color: var(--accent); font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; font-weight: 700; }
  h1 { font-size: 34px; font-weight: 800; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; flex: 1; align-items: center; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  li { display: flex; gap: 12px; align-items: flex-start; font-size: 18px; line-height: 1.4; }
  li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex-shrink: 0; }
  .diagram { display: flex; align-items: center; justify-content: center; }
  .diagram svg { width: 100%; max-width: 260px; }
  .node { transform-origin: center; transform-box: fill-box; }
  .slide-footer { position: absolute; bottom: 0; left: 0; right: 0; height: 26px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    z-index: 100; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(11,12,26,0.7); }
  .brand, .slide-num { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
</style>
<div class="slide">
  <div class="eyebrow" data-anim data-anim-from="down">the workhorse</div>
  <h1 data-anim data-anim-from="up">A column beside a visual</h1>
  <div class="cols">
    <ul>
      <li data-anim data-anim-from="left"><span class="dot"></span><span>Points enter staggered — group by <code>data-anim-from</code>.</span></li>
      <li data-anim data-anim-from="left"><span class="dot"></span><span>The supporting visual carries a subtle baseline idle.</span></li>
      <li data-anim data-anim-from="left"><span class="dot"></span><span>Everything clears the footer safe-zone.</span></li>
    </ul>
    <div class="diagram" data-anim data-anim-from="right">
      <svg viewBox="0 0 200 120" aria-hidden="true">
        <line x1="40" y1="60" x2="100" y2="30" stroke="var(--accent)" stroke-width="2"/>
        <line x1="40" y1="60" x2="100" y2="90" stroke="var(--accent)" stroke-width="2"/>
        <line x1="100" y1="30" x2="160" y2="60" stroke="var(--accent)" stroke-width="2"/>
        <line x1="100" y1="90" x2="160" y2="60" stroke="var(--accent)" stroke-width="2"/>
        <circle class="node" cx="40"  cy="60" r="14" fill="var(--accent)"/>
        <circle class="node" cx="100" cy="30" r="14" fill="var(--accent-2)"/>
        <circle class="node" cx="100" cy="90" r="14" fill="var(--accent-2)"/>
        <circle class="node" cx="160" cy="60" r="14" fill="var(--accent)"/>
      </svg>
    </div>
  </div>
</div>
<div class="slide-footer">
  <span class="brand">slides-animejs</span>
  <span class="slide-num">3 / 5</span>
</div>
<script type="module">
  import { animate } from "/assets/anime.esm.min.js";
  // Baseline idle: nodes breathe with a stagger. Animate inner <circle> shapes
  // (transform-box: fill-box) so CSS scale doesn't fight an SVG <g> transform.
  window.__slideTL = window.__slideTL || {};
  window.__slideTL[2] = (root) => {
    const nodes = root.querySelectorAll('.node');
    const a = animate(nodes, {
      scale: [{ to: 1.12 }, { to: 1 }],
      duration: 2000, delay: (_, i) => i * 180, loop: true, alternate: true, ease: 'inOutSine',
    });
    return { cancel: () => { try { a.cancel?.(); } catch (e) {} } };
  };
</script>
